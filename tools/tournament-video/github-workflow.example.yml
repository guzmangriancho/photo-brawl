# EJEMPLO, NO ACTIVO (no esta en .github/workflows). Genera el video de un torneo bajo demanda.
# Diseno seguro: el repo es publico, asi que NO se suben artefactos (los artefactos y logs de un repo publico
# los puede leer cualquiera con sesion de GitHub). El mp4 se sube a un bucket PRIVADO de Supabase y se entrega con URL firmada.
# Secretos (Settings > Secrets): SUPABASE_SERVICE_KEY, PB_API_BASE, PB_TOKEN (token de una cuenta de la app; caduca, ver README). Nunca llegan al navegador.
name: tournament-video
on:
  workflow_dispatch:
    inputs:
      tournament_id: { description: 'UUID del torneo terminado', required: true }
      day:           { description: 'Numero de dia del rotulo',   required: true }
permissions: { contents: read }   # minimo
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-numpy
      - run: npm ci --prefix tools/tournament-video
      - name: Exportar, validar, renderizar (sin imprimir datos de torneo)
        env: { PB_API_BASE: '${{ secrets.PB_API_BASE }}', PB_TOKEN: '${{ secrets.PB_TOKEN }}', TID: '${{ inputs.tournament_id }}', DAY: '${{ inputs.day }}' }
        run: |
          set +x
          node tools/tournament-video/export-tournament.cjs "$TID" /tmp/export.json
          node tools/tournament-video/spec-from-export.cjs /tmp/export.json /tmp/spec.json --day "$DAY" > /dev/null
          tools/tournament-video/run.sh /tmp/spec.json /tmp/out > /tmp/render.log 2>&1 || { echo 'fallo el render'; exit 1; }
      - name: Subir a bucket privado
        env: { KEY: '${{ secrets.SUPABASE_SERVICE_KEY }}', TID: '${{ inputs.tournament_id }}' }
        run: curl -sS --fail -X POST -H "Authorization: Bearer $KEY" -H "Content-Type: video/mp4" --data-binary @/tmp/out.whatsapp.mp4 "https://qeplxlmywsckpgoigxfk.supabase.co/storage/v1/object/tournament-videos/$TID.mp4" > /dev/null
